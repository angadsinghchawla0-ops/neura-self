name: Build ROOTMEOW APK

on:
  push:
    branches: [main, rootmeow, master]
    tags: ['v*']
  pull_request:
    branches: [main, rootmeow, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
      _JAVA_OPTIONS: "-Xmx2g"
      PIP_NO_CACHE_DIR: 1

    steps:
      - name: Free up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/python
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo apt-get clean
          docker system prune -af --volumes 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            build-essential libssl-dev libffi-dev \
            libncurses5-dev libncursesw5-dev libsqlite3-dev \
            libreadline-dev libbz2-dev zlib1g-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        run: |
          # Use shallow p4a clone to save disk space
          export P4A_BOOTSTRAP=sdl2
          export PIP_NO_CACHE_DIR=1
          python rootmeow_apk.py
        env:
          BUILDOZER_WARN_ON_ROOT: 1
          GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
          _JAVA_OPTIONS: "-Xmx2g"
          PIP_NO_CACHE_DIR: 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROOTMEOW-APK
          path: |
            ROOTMEOW-v*.apk
            bin/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ROOTMEOW-v*.apk
            bin/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}